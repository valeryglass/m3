project:
  name: m3
  description: Personal CBT-oriented model workspace and Telegram episode extractor.
  structural_ssot: project.manifest.yaml
  architecture_doc: docs/architecture.md
  lifecycle_doc: docs/lifecycle.md
  roadmap_doc: docs/roadmap.md
  domain_ssot:
    - model/cbt.md
    - model/graph.md
    - model/episode.schema.json

lifecycle_stages:
  - draft
  - prototype
  - experimental
  - stable
  - legacy
  - archived

gates:
  observed_ready: Required observed episode fields are present.
  annotation_ready: Selected derived annotations have nodes and at least one annotation.
  graph_ready: Selected derived annotations have graph material and relations.
  report_ready: Graph data is valid enough for cross-episode analytics.
  payload_eligible: Episode can contribute to payload-level summaries.

modules:
  telegram_capture:
    stage: experimental
    enabled: true
    purpose: Adapt Telegram messages and callbacks into the capture pipeline.
    owned_paths:
      - app/telegram_bot.py
      - app/loop_extractor.py
      - app/session_store.py
      - app/user_flow_router.py
      - app/capture_flow_store.py
      - app/messages.py
      - app/tone_engine.py
      - app/tone.yaml
      - data/runtime-sessions/
      - data/runtime-flows/
    inputs:
      - Telegram messages and callbacks
      - data/runtime-sessions/*.json
    outputs:
      - observed episode drafts
      - mode-specific capture evidence
      - observed source episode files
      - data/ux-events/*.jsonl
    interfaces:
      - capture_to_episode
      - capture_to_draft
      - draft_to_episode
    capabilities:
      - ten_step_episode_collection
      - tone_controlled_prompts
      - private_runtime_session_memory
      - explicit_userflow_routing
      - private_runtime_flow_memory
      - first_class_capture_modes
      - transcript_confirmation_routing
      - direct_extraction_to_review

  telegram_media:
    stage: draft
    enabled: true
    purpose: Temporary download and cleanup boundary for Telegram voice/audio media before transcription.
    owned_paths:
      - app/telegram_media.py
      - docs/modules/telegram-media.md
    inputs:
      - Telegram voice file metadata
      - Telegram audio file metadata
      - Telegram audio-like document metadata
    outputs:
      - temporary media material for transcription
      - media rejection and download failure reasons
    capabilities:
      - telegram_file_download_boundary
      - media_size_mime_and_duration_guards
      - raw_audio_temp_cleanup

  input_funnels:
    stage: draft
    enabled: true
    purpose: Normalize user input surfaces into pre-episode capture artifacts.
    owned_paths:
      - app/input_funnels.py
      - app/transcription.py
      - app/whisper_provider.py
      - docs/modules/input-funnels.md
    inputs:
      - Telegram text messages
      - Telegram voice notes and audio uploads
      - future structured forms
    outputs:
      - normalized input artifacts
    interfaces:
      - input_to_draft
    capabilities:
      - surface_input_normalization
      - pre_episode_artifact_boundary

  capture_artifacts:
    stage: experimental
    enabled: true
    purpose: Persist complete mode-specific capture evidence before extraction.
    owned_paths:
      - app/capture_artifacts.py
      - app/schemas/capture.py
      - docs/modules/capture-artifacts.md
      - data/capture-artifacts/
    inputs:
      - completed 10Q field evidence
      - completed three-block evidence
      - one-take text
      - confirmed IntakeTranscript text
    outputs:
      - private immutable CaptureArtifact JSON
    interfaces:
      - capture_to_draft
    capabilities:
      - exact_capture_piece_retention
      - source_piece_hashing
      - raw_audio_free_capture_provenance

  capture_extraction:
    stage: experimental
    enabled: true
    purpose: Project source-grounded capture evidence into schema-complete EpisodeDrafts.
    owned_paths:
      - app/capture_extraction.py
      - app/capture_debug.py
      - app/capture_provider.py
      - app/deepseek_capture_extractor.py
      - app/openai_capture_extractor.py
      - docs/modules/capture-extraction.md
      - data/capture-extractions/
      - data/capture-debug/
    inputs:
      - private CaptureArtifact JSON
      - explicit extraction provider configuration
    outputs:
      - private CaptureExtraction sidecars
      - private capture debug sidecars
      - schema-complete EpisodeDrafts
      - typed safe failure codes
    interfaces:
      - capture_to_draft
    capabilities:
      - deterministic_classic_projection
      - explicit_runtime_mode_selection
      - deepseek_capture_extraction
      - strict_structured_output_extraction
      - source_quote_grounding
      - typed_extraction_failures
      - private_provider_debug_sidecars


  intake_transcripts:
    stage: draft
    enabled: true
    purpose: Persist transcript source artifacts produced from audio intake.
    owned_paths:
      - app/intake_transcripts.py
      - app/schemas/intake_transcript.py
      - docs/modules/intake-transcripts.md
      - data/intake-transcripts/
    inputs:
      - transcribed voice/audio input artifacts
    outputs:
      - durable transcript source JSON files
    capabilities:
      - transcript_source_artifact_storage
      - raw_audio_free_provenance
      - confirmed_episode_backlink

  episode_drafts:
    stage: draft
    enabled: true
    purpose: Stage provisional observed episode material before confirmation and persistence.
    owned_paths:
      - app/episode_drafts.py
      - app/draft_review.py
      - app/draft_review_sessions.py
      - docs/modules/episode-drafts.md
    inputs:
      - direct classic field projection
      - successful CaptureExtraction results
      - user confirmation decisions
    outputs:
      - complete provisional episode drafts
      - private DraftReviewSession JSON
      - confirmed observed fields
    interfaces:
      - capture_to_draft
      - draft_to_episode
    capabilities:
      - provisional_episode_staging
      - confirmation_boundary
      - separate_review_session_storage

  gap_hydration:
    stage: experimental
    enabled: true
    purpose: Explore next-question selection for incomplete drafts outside production capture.
    owned_paths:
      - app/gap_hydration.py
      - docs/modules/gap-hydration.md
    inputs:
      - episode drafts
      - canonical required observed fields
      - draft field quality notes
    outputs:
      - next gap question
      - remaining gap list
    capabilities:
      - missing_field_selection
      - reusable_capture_gap_questions

  episode_model_storage:
    stage: experimental
    enabled: true
    purpose: Define and persist observed source episode artifacts.
    owned_paths:
      - model/episode.schema.json
      - model/episode.example.json
      - model/episode.template.json
      - app/schemas/episode.py
      - app/storage.py
      - app/derived_normalizer.py
      - app/analytics_loader.py
      - app/annotation_migration.py
    inputs:
      - observed episode fields
      - selected annotation-run data for analytics hydration
      - legacy episode files
    outputs:
      - validated observed source Episode JSON
      - analytics-ready Episode objects with hydrated derived data
      - normalized private legacy episode records from migration/compat tools
    interfaces:
      - capture_to_episode
      - draft_to_episode
      - episode_to_annotation
    capabilities:
      - schema_validation
      - observed_only_episode_persistence
      - annotation_run_hydration
      - migration_compatible_normalization
      - evidence_provenance_storage

  annotation_runs:
    stage: experimental
    enabled: true
    purpose: Manage durable annotation-run records and read-only readiness audits.
    owned_paths:
      - app/annotation_audit.py
      - app/annotation_runs.py
      - app/fresh_analytics_status.py
      - app/readiness.py
      - app/schemas/annotation_run.py
      - roles/annotator.md
    inputs:
      - validated observed source Episode JSON
      - annotation-run records
    outputs:
      - derived nodes
      - derived annotations
      - derived relations
      - data/annotation-runs/
      - readiness audit summaries
    interfaces:
      - episode_to_annotation
      - annotation_to_report
    gates:
      - observed_ready
      - annotation_ready
      - graph_ready
      - report_ready
      - payload_eligible
    capabilities:
      - readiness_audit
      - annotation_run_loading
      - selected_derived_validation
      - fresh_analytics_status_recommendation

  annotation_producer:
    stage: experimental
    enabled: true
    purpose: Produce deterministic derived annotation rows from observed episodes.
    owned_paths:
      - app/episode_annotator.py
      - app/annotation_producer.py
      - app/domain_classifier.py
      - app/domain_enrichment.py
      - docs/modules/annotation-producer.md
    inputs:
      - validated observed source Episode JSON
      - selected existing annotation-run for missing-only production
    outputs:
      - data/annotation-runs/
      - annotation coverage delta summaries
    interfaces:
      - episode_to_annotation
    capabilities:
      - deterministic_episode_annotation
      - annotation_run_production
      - missing_annotation_backfill
      - self_contained_annotation_snapshots
      - life_domain_annotation
      - reviewed_domain_enrichment

  graph_reporting:
    stage: experimental
    enabled: true
    purpose: Build on-demand graph views and optional Markdown debug exports from hydrated episodes.
    owned_paths:
      - app/graph_report.py
      - app/pattern_metrics.py
      - app/user_report.py
      - app/report_cards.py
      - app/report_entities.py
      - app/report_view_model.py
      - app/report_interpretation.py
      - app/profile_interpreter.py
      - app/report_payload_qa.py
      - model/graph.md
    inputs:
      - hydrated graph-ready episodes
    outputs:
      - computed GraphReport views
      - deterministic fallback reports and split LLM brief/expanded interpretations
      - private-data-safe report/payload QA summaries
      - optional Markdown debug exports
    interfaces:
      - annotation_to_report
      - report_to_insight_payload
    capabilities:
      - graph_readiness_summary
      - signature_counts
      - source_split_reports
      - deterministic_pattern_metrics
      - user_profile_report_rendering
      - card_composed_profile_reports
      - report_view_model_rendering
      - production_llm_profile_interpretation
      - structured_evidence_interpretation
      - split_brief_expanded_interpretation
      - lazy_expanded_profile_rendering
      - accepted_domain_graph_signatures
      - report_payload_consistency_qa

  insight_payloads:
    stage: experimental
    enabled: true
    purpose: Produce shared deterministic analytics payloads for report and map consumers.
    owned_paths:
      - app/insight_payload.py
      - docs/modules/insight-payloads.md
      - data/exports/insight-payload/
    inputs:
      - computed GraphReport views
      - deterministic pattern metrics
    outputs:
      - target-agnostic InsightPayload JSON
      - shared analytics entities for report and map consumers
    interfaces:
      - report_to_insight_payload
      - report_to_payload
    capabilities:
      - shared_insight_payload
      - target_agnostic_analytics
      - deterministic_payload_export
      - strict_explicit_run_export
      - primary_domain_analytics

  pattern_payloads:
    stage: experimental
    enabled: true
    purpose: Produce renderer-neutral pattern payloads from report-ready episodes.
    owned_paths:
      - app/map_payload.py
      - app/spatial_payload.py
      - app/map_topology.py
      - app/map_grid.py
      - app/hex_world.py
      - app/map_payload_html.py
      - app/hex_world_html.py
      - data/exports/map-payload/
      - data/exports/hex-world/
    inputs:
      - report-ready episodes
      - shared InsightPayload analytics
      - spatial payload projections
    outputs:
      - explicit map payload JSON exports
      - explicit hex-world layout JSON exports
      - explicit map HTML preview exports
      - explicit diagnostic hex-world HTML preview exports
    interfaces:
      - report_to_payload
    gates:
      - payload_eligible
    capabilities:
      - frequency_ranking
      - fork_convergence_outcome_analysis
      - one_week_drift_novelty_stability
      - backend_map_payload
      - strict_explicit_run_export
      - hex_world_spatial_layout
      - axial_hex_grid_math
      - map_payload_html_preview
      - hex_world_html_diagnostic_preview

  ux_analytics:
    stage: prototype
    enabled: true
    purpose: Record and aggregate step-level Telegram UX events on demand.
    owned_paths:
      - app/ux_events.py
      - app/ux_analytics.py
      - data/ux-events/
    inputs:
      - Telegram loop step events
    outputs:
      - private JSONL event logs
      - UX aggregate summaries
      - optional UX debug exports
    capabilities:
      - append_only_event_log
      - funnel_summary
      - saved_ux_reports

  process_journal:
    stage: prototype
    enabled: true
    purpose: Record private repo-level process events for operator observability.
    owned_paths:
      - app/journal.py
      - docs/modules/process-journal.md
      - data/journal/
    inputs:
      - safe process metadata
      - artifact ids and paths
      - aggregate counts and failure codes
    outputs:
      - private append-only process journal JSONL
    capabilities:
      - append_only_process_journal
      - private_safe_event_metadata
      - best_effort_journal_writes

  userlist_access:
    stage: prototype
    enabled: true
    purpose: Track approved/waitlisted Telegram users and admin metadata.
    owned_paths:
      - app/userlist.py
      - data/userlist/users.json
    inputs:
      - Telegram user profile metadata
      - admin approval changes
    outputs:
      - private userlist records
      - admin waitlist notifications
    capabilities:
      - approved_user_gate
      - waitlist_profile_capture

interfaces:
  capture_to_draft:
    state: experimental
    owner: capture_extraction
    consumers:
      - episode_drafts
    contract_doc: docs/interfaces/capture-to-draft.md

  input_to_draft:
    state: draft
    owner: input_funnels
    consumers:
      - episode_drafts
    contract_doc: docs/interfaces/input-to-draft.md

  draft_to_episode:
    state: draft
    owner: episode_drafts
    consumers:
      - episode_model_storage
    contract_doc: docs/interfaces/draft-to-episode.md

  capture_to_episode:
    state: open
    owner: telegram_capture
    consumers:
      - episode_model_storage
    contract_doc: docs/interfaces/capture-to-episode.md

  episode_to_annotation:
    state: open
    owner: episode_model_storage
    consumers:
      - annotation_runs
    contract_doc: docs/interfaces/episode-to-annotation.md

  annotation_to_report:
    state: open
    owner: annotation_runs
    consumers:
      - graph_reporting
    contract_doc: docs/interfaces/annotation-to-report.md

  report_to_insight_payload:
    state: open
    owner: graph_reporting
    consumers:
      - insight_payloads
    contract_doc: docs/interfaces/report-to-insight-payload.md

  report_to_payload:
    state: open
    owner: insight_payloads
    consumers:
      - pattern_payloads
    contract_doc: docs/interfaces/report-to-payload.md

adr_policy:
  required_for:
    - schema changes
    - module boundary changes
    - interface contract changes
    - data flow changes
    - lifecycle policy changes
  not_required_for:
    - small prompt copy edits
    - local bug fixes inside an existing module
    - test-only changes that do not alter behavior
