project:
  name: m3
  description: Personal CBT-oriented model workspace and Telegram episode extractor.
  structural_ssot: project.manifest.yaml
  architecture_doc: docs/architecture.md
  lifecycle_doc: docs/lifecycle.md
  roadmap_doc: docs/roadmap.md
  domain_ssot:
    - model/cbt.md
    - model/graph.md
    - model/episode.schema.json

lifecycle_stages:
  - draft
  - prototype
  - experimental
  - stable
  - legacy
  - archived

gates:
  observed_ready: Required observed episode fields are present.
  annotation_ready: Selected derived annotations have nodes and at least one annotation.
  graph_ready: Selected derived annotations have graph material and relations.
  report_ready: Graph data is valid enough for cross-episode analytics.
  payload_eligible: Episode can contribute to payload-level summaries.

modules:
  telegram_capture:
    stage: experimental
    enabled: true
    purpose: Adapt Telegram messages and callbacks into the capture pipeline.
    owned_paths:
      - app/telegram_bot.py
      - app/loop_extractor.py
      - app/session_store.py
      - app/messages.py
      - app/tone_engine.py
      - app/user_report.py
      - config/tone.yaml
      - data/runtime-sessions/
    inputs:
      - Telegram messages and callbacks
      - data/runtime-sessions/*.json
    outputs:
      - observed episode drafts
      - observed source episode files
      - data/ux-events/*.jsonl
    interfaces:
      - capture_to_episode
    capabilities:
      - ten_step_episode_collection
      - tone_controlled_prompts
      - user_profile_report_rendering
      - private_runtime_session_memory

  telegram_media:
    stage: draft
    enabled: true
    purpose: Temporary download and cleanup boundary for Telegram voice/audio media before transcription.
    owned_paths:
      - app/telegram_media.py
      - docs/modules/telegram-media.md
    inputs:
      - Telegram voice file metadata
      - Telegram audio file metadata
      - Telegram audio-like document metadata
    outputs:
      - temporary media material for transcription
      - media rejection and download failure reasons
    capabilities:
      - telegram_file_download_boundary
      - media_size_mime_and_duration_guards
      - raw_audio_temp_cleanup

  input_funnels:
    stage: draft
    enabled: true
    purpose: Normalize user input surfaces into pre-episode capture artifacts.
    owned_paths:
      - app/input_funnels.py
      - app/transcription.py
      - docs/modules/input-funnels.md
    inputs:
      - Telegram text messages
      - Telegram voice notes and audio uploads
      - future structured forms
    outputs:
      - normalized input artifacts
    interfaces:
      - input_to_draft
    capabilities:
      - surface_input_normalization
      - pre_episode_artifact_boundary

  episode_drafts:
    stage: draft
    enabled: true
    purpose: Stage provisional observed episode material before confirmation and persistence.
    owned_paths:
      - app/episode_drafts.py
      - app/draft_review.py
      - docs/modules/episode-drafts.md
    inputs:
      - normalized input artifacts
      - field updates from capture flows
      - gap answers
      - user confirmation decisions
    outputs:
      - partial episode drafts
      - confirmed observed fields
    interfaces:
      - input_to_draft
      - draft_to_episode
    capabilities:
      - provisional_episode_staging
      - confirmation_boundary

  gap_hydration:
    stage: draft
    enabled: true
    purpose: Select the smallest useful next question for incomplete episode drafts.
    owned_paths:
      - app/gap_hydration.py
      - docs/modules/gap-hydration.md
    inputs:
      - episode drafts
      - canonical required observed fields
      - draft field quality notes
    outputs:
      - next gap question
      - remaining gap list
    capabilities:
      - missing_field_selection
      - reusable_capture_gap_questions

  episode_model_storage:
    stage: experimental
    enabled: true
    purpose: Define and persist observed source episode artifacts.
    owned_paths:
      - model/episode.schema.json
      - model/episode.example.json
      - model/episode.template.json
      - app/schemas/episode.py
      - app/storage.py
      - app/derived_normalizer.py
      - app/analytics_loader.py
      - app/annotation_migration.py
    inputs:
      - observed episode fields
      - selected annotation-run data for analytics hydration
      - legacy episode files
    outputs:
      - validated observed source Episode JSON
      - analytics-ready Episode objects with hydrated derived data
      - normalized private legacy episode records from migration/compat tools
    interfaces:
      - capture_to_episode
      - draft_to_episode
      - episode_to_annotation
    capabilities:
      - schema_validation
      - observed_only_episode_persistence
      - annotation_run_hydration
      - migration_compatible_normalization
      - evidence_provenance_storage

  annotation_runs:
    stage: experimental
    enabled: true
    purpose: Manage durable annotation-run records and read-only readiness audits.
    owned_paths:
      - app/annotation_audit.py
      - app/annotation_runs.py
      - app/readiness.py
      - app/schemas/annotation_run.py
      - roles/annotator.md
    inputs:
      - validated observed source Episode JSON
      - annotation-run records
    outputs:
      - derived nodes
      - derived annotations
      - derived relations
      - data/annotation-runs/
      - readiness audit summaries
    interfaces:
      - episode_to_annotation
      - annotation_to_report
    gates:
      - observed_ready
      - annotation_ready
      - graph_ready
      - report_ready
      - payload_eligible
    capabilities:
      - readiness_audit
      - annotation_run_loading
      - selected_derived_validation

  graph_reporting:
    stage: experimental
    enabled: true
    purpose: Build on-demand graph views and optional Markdown debug exports from hydrated episodes.
    owned_paths:
      - app/graph_report.py
      - model/graph.md
    inputs:
      - hydrated graph-ready episodes
    outputs:
      - computed GraphReport views
      - optional Markdown debug exports
    interfaces:
      - annotation_to_report
      - report_to_payload
    capabilities:
      - graph_readiness_summary
      - signature_counts
      - source_split_reports

  pattern_payloads:
    stage: experimental
    enabled: true
    purpose: Produce renderer-neutral pattern payloads from report-ready episodes.
    owned_paths:
      - app/pattern_metrics.py
      - app/map_payload.py
      - app/map_topology.py
      - app/map_grid.py
      - app/hex_world.py
      - app/map_payload_html.py
      - app/hex_world_html.py
      - data/exports/map-payload/
      - data/exports/hex-world/
    inputs:
      - report-ready episodes
      - graph signature counters
    outputs:
      - explicit map payload JSON exports
      - explicit hex-world layout JSON exports
      - explicit map HTML preview exports
      - explicit diagnostic hex-world HTML preview exports
    interfaces:
      - report_to_payload
    gates:
      - payload_eligible
    capabilities:
      - frequency_ranking
      - fork_convergence_outcome_analysis
      - one_week_drift_novelty_stability
      - backend_map_payload
      - hex_world_spatial_layout
      - axial_hex_grid_math
      - map_payload_html_preview
      - hex_world_html_diagnostic_preview

  ux_analytics:
    stage: prototype
    enabled: true
    purpose: Record and aggregate step-level Telegram UX events on demand.
    owned_paths:
      - app/ux_events.py
      - app/ux_analytics.py
      - data/ux-events/
    inputs:
      - Telegram loop step events
    outputs:
      - private JSONL event logs
      - UX aggregate summaries
      - optional UX debug exports
    capabilities:
      - append_only_event_log
      - funnel_summary
      - saved_ux_reports

  userlist_access:
    stage: prototype
    enabled: true
    purpose: Track approved/waitlisted Telegram users and admin metadata.
    owned_paths:
      - app/userlist.py
      - data/userlist/users.json
    inputs:
      - Telegram user profile metadata
      - admin approval changes
    outputs:
      - private userlist records
      - admin waitlist notifications
    capabilities:
      - approved_user_gate
      - waitlist_profile_capture

interfaces:
  input_to_draft:
    state: draft
    owner: input_funnels
    consumers:
      - episode_drafts
    contract_doc: docs/interfaces/input-to-draft.md

  draft_to_episode:
    state: draft
    owner: episode_drafts
    consumers:
      - episode_model_storage
    contract_doc: docs/interfaces/draft-to-episode.md

  capture_to_episode:
    state: open
    owner: telegram_capture
    consumers:
      - episode_model_storage
    contract_doc: docs/interfaces/capture-to-episode.md

  episode_to_annotation:
    state: open
    owner: episode_model_storage
    consumers:
      - annotation_runs
    contract_doc: docs/interfaces/episode-to-annotation.md

  annotation_to_report:
    state: open
    owner: annotation_runs
    consumers:
      - graph_reporting
    contract_doc: docs/interfaces/annotation-to-report.md

  report_to_payload:
    state: open
    owner: graph_reporting
    consumers:
      - pattern_payloads
    contract_doc: docs/interfaces/report-to-payload.md

adr_policy:
  required_for:
    - schema changes
    - module boundary changes
    - interface contract changes
    - data flow changes
    - lifecycle policy changes
  not_required_for:
    - small prompt copy edits
    - local bug fixes inside an existing module
    - test-only changes that do not alter behavior
